name: Gerar jogo para Windows

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
        working-directory: codigoC/revia
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-raylib

      - name: Compilar
        run: make

      - name: Montar a pasta do jogo
        run: |
          ls -la build
          mkdir -p ../../dist/REVIA
          cp build/revia.exe ../../dist/REVIA/
          cp -r levels ../../dist/REVIA/
          cp -r assets ../../dist/REVIA/ || true
          ldd build/revia.exe | tee /tmp/ldd.txt
          for dll in $(awk '/ucrt64/ {print $3}' /tmp/ldd.txt); do
            cp "$dll" ../../dist/REVIA/ || true
          done
          cp /ucrt64/bin/libraylib*.dll ../../dist/REVIA/ 2>/dev/null || true
          cp /ucrt64/bin/glfw3.dll ../../dist/REVIA/
          ls -la ../../dist/REVIA

      - uses: actions/upload-artifact@v4
        with:
          name: REVIA-Windows
          path: dist/REVIA
